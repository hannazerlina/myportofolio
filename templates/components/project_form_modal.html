<dialog id="project-form-modal" class="project-form-modal">
    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                onclick="closeProjectModal()"
                aria-label="Tutup form">
            ×
        </button>

        <h2>Tambah Proyek</h2>
        <form id="project-form"
            method="post"
            action="{% url 'main:create_project_ajax' %}">
            {% csrf_token %}

            <div class="editor-fields">
                {% for field in form %}
                    <div class="editor-field">
                        <label for="{{ field.id_for_label }}">
                            {{ field.label }}
                        </label>
                        {{ field }}
                    </div>
                {% endfor %}
            </div>

            <div class="editor-actions">
                <button type="button"
                        class="editor-cancel"
                        onclick="closeProjectModal()">
                    Batal
                </button>
                <button type="submit" class="editor-save">
                    Simpan Proyek
                </button>
            </div>
        </form>
    </div>
</dialog>
